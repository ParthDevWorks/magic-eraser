# Same as Black.
line-length = 88
indent-width = 4

[lint]
select = ["E", "F", "I", "B", "UP"]

# E501: Don't want lint errors for long lines that the formatter intentionally leaves alone.
ignore = ["E501"] 

[lint.isort]
known-first-party = ["magic_eraser"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
